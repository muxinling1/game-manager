<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>本地游戏库管理器</title>
<style>
  :root {
    --bg:#15181e; --panel:#1c2028; --panel2:#232833; --panel3:#2b3140;
    --line:#303644; --line-soft:#262b36; --text:#e7eaf1; --muted:#8d95a6;
    --muted2:#666e80; --accent:#4c8bf5; --accent-hi:#6aa0ff;
    --accent-soft:rgba(76,139,245,.16); --ok:#43c088; --star:#f0b64a;
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); height:100vh; overflow:hidden; }
  button { font-family:inherit; cursor:pointer; border:0; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#39404f; border-radius:6px; border:2px solid var(--bg); }

  .window { display:grid; grid-template-rows:56px 1fr 34px;
            grid-template-columns:216px 1fr; height:100vh; }

  /* 顶栏 */
  .topbar { grid-column:1/-1; display:flex; align-items:center; gap:14px;
            padding:0 16px; background:var(--panel); border-bottom:1px solid var(--line-soft); }
  .logo { width:26px; height:26px; border-radius:7px; display:grid; place-items:center;
          background:linear-gradient(135deg,var(--accent-hi),#8a5cf6); color:#fff; font-weight:700; flex:none; }
  .brand b { font-size:14px; }
  .brand span { display:block; font-size:10px; color:var(--muted2); letter-spacing:1px; }
  .search { flex:1; max-width:340px; height:32px; display:flex; align-items:center; gap:9px;
            background:var(--panel2); border:1px solid var(--line); border-radius:5px;
            padding:0 11px; margin-left:10px; color:var(--muted); }
  .search:focus-within { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .search input { flex:1; background:none; border:0; outline:none; color:var(--text);
                  font-size:13px; font-family:inherit; }
  .search input::placeholder { color:var(--muted2); }
  .tag-input { height:32px; width:120px; background:var(--panel2); border:1px solid var(--line);
               border-radius:5px; padding:0 10px; color:var(--text); font-size:12px;
               font-family:inherit; outline:none; }
  .tag-input:focus { border-color:var(--accent); }
  .top-actions { margin-left:auto; display:flex; align-items:center; gap:8px; }
  .icon-btn { width:32px; height:32px; border-radius:5px; background:transparent;
              color:var(--muted); display:grid; place-items:center; font-size:14px; }
  .icon-btn:hover { background:var(--panel3); color:var(--text); }
  .icon-btn.on { background:var(--accent-soft); color:var(--accent-hi); }
  .seg { display:flex; background:var(--panel2); border:1px solid var(--line); border-radius:5px; padding:2px; }
  .seg button { background:none; color:var(--muted); border-radius:3px; width:30px; height:26px;
                display:grid; place-items:center; font-size:13px; }
  .seg button.on { background:var(--accent); color:#fff; }
  .btn-primary { height:32px; padding:0 14px; border-radius:5px; background:var(--accent);
                 color:#fff; font-size:12.5px; font-weight:600; }
  .btn-primary:hover { background:var(--accent-hi); }
  .btn-primary:disabled { background:var(--panel3); color:var(--muted2); cursor:not-allowed; }

  /* 左栏 */
  .sidebar { background:var(--panel); border-right:1px solid var(--line-soft);
             padding:14px 10px; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
  .side-title { font-size:10px; letter-spacing:1px; color:var(--muted2);
                padding:10px 10px 6px; text-transform:uppercase; }
  .nav { display:flex; align-items:center; gap:10px; height:34px; padding:0 10px;
         border-radius:5px; font-size:13px; color:var(--muted); background:none;
         width:100%; text-align:left; border-left:2px solid transparent; }
  .nav:hover { background:var(--panel2); color:var(--text); }
  .nav.on { background:var(--accent-soft); color:var(--accent-hi); border-left-color:var(--accent); }
  .nav .count { margin-left:auto; font-size:11px; color:var(--muted2); }
  .nav.on .count { color:var(--accent-hi); }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; flex:none; }
  .stat-box { margin-top:auto; padding:12px; border-radius:8px; background:var(--panel2);
              border:1px solid var(--line-soft); font-size:11.5px; color:var(--muted); }
  .stat-box .row { display:flex; justify-content:space-between; padding:3px 0; }
  .stat-box b { color:var(--text); font-weight:600; }
  .stat-box hr { border:0; border-top:1px solid var(--line); margin:8px 0; }

  /* 主区 */
  .main { display:flex; flex-direction:column; min-width:0; overflow:hidden; }
  .content-head { display:flex; align-items:center; gap:12px; padding:16px 20px 10px; flex:none; }
  .content-head h1 { font-size:17px; font-weight:600; }
  .content-head .sub { font-size:12px; color:var(--muted2); }
  .scroll { flex:1; overflow-y:auto; padding:4px 20px 16px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(146px,1fr)); gap:18px 16px; }
  .card { cursor:pointer; user-select:none; }
  .cover { position:relative; aspect-ratio:2/3; border-radius:8px; overflow:hidden;
           border:2px solid transparent; display:grid; place-items:center;
           box-shadow:0 6px 16px rgba(0,0,0,.35); transition:transform .14s,border-color .14s; }
  .card:hover .cover { transform:translateY(-3px); }
  .card.selected .cover { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .cover .initials { font-size:38px; font-weight:800; letter-spacing:-2px;
                     color:rgba(255,255,255,.92); text-shadow:0 2px 12px rgba(0,0,0,.4); }
  .cover .grain { position:absolute; inset:0; background-image:
      linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px); background-size:18px 18px; }
  .cover .shine { position:absolute; inset:0; background:linear-gradient(160deg,rgba(255,255,255,.16),transparent 55%); }
  .cover .ph { position:absolute; bottom:7px; left:0; right:0; text-align:center;
               font-size:9px; letter-spacing:.6px; color:rgba(255,255,255,.5); }
  .card .name { font-size:12.5px; margin-top:9px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card.selected .name { color:var(--accent-hi); }
  .card .meta { font-size:10.5px; color:var(--muted2); margin-top:2px;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* 列表视图 */
  .list-view .grid { display:block; }
  .list-head { display:none; grid-template-columns:42px 1.6fr 1fr 1.2fr 70px 80px;
               gap:12px; padding:0 10px 8px; font-size:10.5px; letter-spacing:.8px;
               text-transform:uppercase; color:var(--muted2); }
  .list-view .list-head { display:grid; }
  .list-view .card { display:grid; grid-template-columns:42px 1.6fr 1fr 1.2fr 70px 80px;
                     align-items:center; gap:12px; height:52px; padding:0 10px; border-radius:5px; }
  .list-view .card:hover { background:var(--panel2); }
  .list-view .card.selected { background:var(--accent-soft); }
  .list-view .cover { width:32px; height:44px; border-radius:3px; aspect-ratio:auto;
                      box-shadow:none; transform:none !important; }
  .list-view .cover .initials { font-size:13px; }
  .list-view .cover .grain, .list-view .cover .shine, .list-view .cover .ph { display:none; }
  .list-view .card .name { margin:0; font-size:13px; }
  .list-view .card .meta { margin:0; font-size:12px; color:var(--muted);
                           white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .list-view .card .m-path, .list-view .card .m-plays, .list-view .card .m-state { display:block; }
  .card .m-path, .card .m-plays, .card .m-state { display:none; }
  .list-view .card.selected .name { color:var(--accent-hi); }

  .empty { padding:60px 0; text-align:center; color:var(--muted2); font-size:13px; }

  /* 详情条 */
  .detail { flex:none; margin:0 20px 0; padding:12px 16px; border-radius:8px;
            background:var(--panel2); border:1px solid var(--line);
            display:flex; align-items:center; gap:18px; min-height:62px; }
  .detail .d-title { font-size:13.5px; font-weight:600; min-width:140px; }
  .detail .d-sub { font-size:11px; color:var(--muted2); margin-top:3px; }
  .detail .d-fields { display:flex; gap:20px; font-size:11.5px; color:var(--muted); min-width:0; }
  .detail .d-fields b { display:block; color:var(--text); font-size:12.5px;
                        font-weight:600; margin-top:3px; white-space:nowrap;
                        overflow:hidden; text-overflow:ellipsis; max-width:180px; }
  .detail .btn-primary { margin-left:auto; flex:none; }
  .detail.empty-detail { justify-content:center; color:var(--muted2); font-size:12.5px; }

  /* 状态栏 */
  .statusbar { grid-column:1/-1; display:flex; align-items:center; gap:18px; padding:0 16px;
               background:var(--panel); border-top:1px solid var(--line-soft);
               font-size:11px; color:var(--muted2); }
  .statusbar .live { display:flex; align-items:center; gap:6px; }
  .statusbar .right { margin-left:auto; display:flex; align-items:center; gap:14px; }
</style>
</head>
<body>
<div class="window">
  <header class="topbar">
    <div class="logo">G</div>
    <div class="brand"><b>本地游戏库</b><span>LOCAL GAME MANAGER</span></div>
    <label class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="搜索名称、标签、路径…">
    </label>
    <input id="tagInput" class="tag-input" type="text" placeholder="标签筛选…">
    <div class="top-actions">
      <div class="seg" title="视图切换">
        <button id="btnGrid" class="on" title="网格视图">▦</button>
        <button id="btnList" title="列表视图">☰</button>
      </div>
      <button class="icon-btn" id="btnRefresh" title="刷新">↻</button>
      <button class="btn-primary" id="btnAdd" disabled title="将在 W3 接入">＋ 添加游戏</button>
    </div>
  </header>

  <aside class="sidebar">
    <div class="side-title">游戏库</div>
    <button class="nav on" id="navAll">▦　所有游戏<span class="count" id="navCount">0</span></button>
    <button class="nav" id="navRecent">◷　最近游玩</button>

    <div class="side-title">按标签筛选</div>
    <div id="tagList"></div>

    <div class="stat-box">
      <div class="row"><span>游戏总数</span><b id="statTotal">0</b></div>
      <div class="row"><span>已启动过</span><b id="statPlayed">0</b></div>
      <div class="row"><span>累计启动</span><b id="statLaunches">0 次</b></div>
      <hr>
      <div class="row"><span>数据文件</span><b>games.db</b></div>
    </div>
  </aside>

  <section class="main" id="main">
    <div class="content-head">
      <div><h1 id="viewTitle">所有游戏</h1><div class="sub" id="viewSub">加载中…</div></div>
    </div>
    <div class="scroll">
      <div class="list-head"><span></span><span>名称</span><span>标签</span><span>路径</span><span>次数</span><span>最后游玩</span></div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display:none">没有匹配的游戏，换个关键字或标签试试。</div>
    </div>
    <div class="detail empty-detail" id="detail">单击任意游戏查看信息</div>
  </section>

  <footer class="statusbar">
    <span class="live" id="bridgeState">● 等待桥接…</span>
    <span id="statusCount">共 0 款游戏</span>
    <span>数据存于本地 games.db</span>
    <span class="right"><span id="runtimeInfo">—</span><span>C2 · pywebview · W2</span></span>
  </footer>
</div>

<script>
  // 封面占位色：与 Python theme.COVER_COLORS 同一组，按名称稳定取值
  const COVER_COLORS = ["#3b2f6b","#2f6b4a","#1f3a5c","#7a5b17",
                        "#6b2323","#2d6b63","#4a2f5c","#2b4a6b"];
  function coverColor(name) {
    let sum = 0;
    for (const ch of unescape(encodeURIComponent(name))) sum += ch.charCodeAt(0);
    return COVER_COLORS[sum % COVER_COLORS.length];
  }
  function initials(name) {
    return name.trim().slice(0, 2).toUpperCase();
  }
  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => (
      {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  const state = { keyword:"", tag:"", view:"all", mode:"grid", rows:[], selected:null };
  const $ = id => document.getElementById(id);
  const api = () => window.pywebview.api;

  function cardHtml(row) {
    const color = coverColor(row.name);
    const short = esc(row.last_played || "—");
    return `<div class="card" data-id="${row.id}">
      <div class="cover" style="background:${color}">
        <div class="grain"></div><div class="shine"></div>
        <div class="initials">${esc(initials(row.name))}</div>
        <div class="ph">COVER PLACEHOLDER</div>
      </div>
      <div class="name">${esc(row.name)}</div>
      <div class="meta m-sub">${esc(row.tags || "无标签")} · ${row.play_count} 次</div>
      <div class="meta m-path">${esc(row.path)}</div>
      <div class="meta m-plays">${row.play_count} 次</div>
      <div class="meta m-state">${short}</div>
    </div>`;
  }

  function renderGames() {
    const grid = $("grid");
    grid.innerHTML = state.rows.map(cardHtml).join("");
    $("empty").style.display = state.rows.length ? "none" : "block";
    $("statusCount").textContent = `共 ${state.rows.length} 款游戏`;
    $("viewSub").textContent = `显示 ${state.rows.length} 款 · ${state.mode === "grid" ? "网格" : "列表"}视图`;
    grid.querySelectorAll(".card").forEach(el => {
      el.addEventListener("click", () => select(+el.dataset.id, el));
    });
    if (state.selected != null) {
      const hit = grid.querySelector(`.card[data-id="${state.selected}"]`);
      if (hit) hit.classList.add("selected");
    }
  }

  async function refreshGames() {
    state.rows = await api().list_games({
      keyword: state.keyword, tag: state.tag, view: state.view
    });
    renderGames();
  }

  async function refreshSide() {
    const [tags, stats] = await Promise.all([api().get_tags(), api().get_stats()]);
    const box = $("tagList");
    if (!tags.length) {
      box.innerHTML = `<div style="font-size:11.5px;color:var(--muted2);padding:0 10px">（暂无标签）</div>`;
    } else {
      box.innerHTML = tags.map(t => {
        const on = state.tag === t.name;
        return `<button class="nav ${on ? "on" : ""}" data-tag="${esc(t.name)}">
          <span class="dot" style="background:${coverColor(t.name)}"></span>
          <span>${esc(t.name)}</span><span class="count">${t.count}</span></button>`;
      }).join("");
      box.querySelectorAll("[data-tag]").forEach(el => {
        el.addEventListener("click", () => {
          const t = el.dataset.tag;
          state.tag = (state.tag === t) ? "" : t;
          $("tagInput").value = state.tag;
          refreshGames(); refreshSide();
        });
      });
    }
    $("statTotal").textContent = stats.total;
    $("statPlayed").textContent = stats.played;
    $("statLaunches").textContent = `${stats.launches} 次`;
    $("navCount").textContent = stats.total;
  }

  async function select(id, el) {
    state.selected = id;
    document.querySelectorAll(".card").forEach(c => c.classList.remove("selected"));
    if (el) el.classList.add("selected");
    const row = await api().get_game(id);
    if (!row) return;
    const detail = $("detail");
    detail.className = "detail";
    detail.innerHTML = `
      <div><div class="d-title">${esc(row.name)}</div>
           <div class="d-sub">${esc(row.tags || "无标签")}</div></div>
      <div class="d-fields">
        <div>游玩次数<b>${row.play_count} 次</b></div>
        <div>最后游玩<b>${esc(row.last_played || "—")}</b></div>
        <div>路径<b>${esc(row.path)}</b></div>
        <div>可执行<b>${esc(row.exe)}</b></div>
      </div>
      <button class="btn-primary" disabled title="将在 W4 接入">▶ 启动（W4）</button>`;
  }

  function setView(view) {
    state.view = view;
    $("navAll").classList.toggle("on", view === "all");
    $("navRecent").classList.toggle("on", view === "recent");
    $("viewTitle").textContent = view === "all" ? "所有游戏" : "最近游玩";
    refreshGames();
  }
  function setMode(mode) {
    state.mode = mode;
    $("main").classList.toggle("list-view", mode === "list");
    $("btnGrid").classList.toggle("on", mode === "grid");
    $("btnList").classList.toggle("on", mode === "list");
    renderGames();
  }

  $("q").addEventListener("input", e => { state.keyword = e.target.value; refreshGames(); });
  $("tagInput").addEventListener("input", e => { state.tag = e.target.value; refreshGames(); refreshSide(); });
  $("btnGrid").addEventListener("click", () => setMode("grid"));
  $("btnList").addEventListener("click", () => setMode("list"));
  $("btnRefresh").addEventListener("click", () => { refreshGames(); refreshSide(); });
  $("navAll").addEventListener("click", () => setView("all"));
  $("navRecent").addEventListener("click", () => setView("recent"));

  window.addEventListener("pywebviewready", async function () {
    try {
      const [v, p] = await Promise.all([api().get_version(), api().ping()]);
      $("bridgeState").textContent = "● 桥接已打通";
      $("bridgeState").style.color = "var(--ok)";
      $("runtimeInfo").textContent = `${v} · ping=${p}`;
    } catch (e) {
      $("bridgeState").textContent = "● 桥接失败";
      $("bridgeState").style.color = "#e2685f";
      $("runtimeInfo").textContent = String(e);
    }
    await Promise.all([refreshGames(), refreshSide()]);
  });
</script>
</body>
</html>
